name: Build OpenBoard master (1.7.7 old and deprecated)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  POWERSHELL_TELEMETRY_OPTOUT: 1

jobs:
  build:
    runs-on: windows-2022

    defaults:
      run:
        shell: cmd

    steps:

      # ------------------------------------------------------------
      # FREE DISK SPACE
      # ------------------------------------------------------------
      - name: Free Disk Space
        shell: pwsh
        run: |
          Write-Host "Disk space BEFORE cleanup:"
          Get-PSDrive C,D
          Remove-Item "C:\Program Files\Android"           -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\hostedtoolcache\windows\CodeQL"  -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:USERPROFILE\.cargo"             -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:USERPROFILE\.rustup"            -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\ghcup"                           -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\Program Files\PostgreSQL"        -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\Program Files\MongoDB"           -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Disk space AFTER cleanup:"
          Get-PSDrive C,D

      # ------------------------------------------------------------
      # CHECKOUT OpenBoard (master)
      # OpenBoard.pro expects ThirdParty as a sibling: ../OpenBoard-ThirdParty
      # We clone into D:\openboard\OpenBoard  so ThirdParty goes to D:\openboard\OpenBoard-ThirdParty
      # ------------------------------------------------------------
      - name: Checkout OpenBoard master
        uses: actions/checkout@v4
        with:
          ref: master
          submodules: recursive
          path: openboard/OpenBoard

      - name: Checkout OpenBoard-ThirdParty
        uses: actions/checkout@v4
        with:
          repository: OpenBoard-org/OpenBoard-ThirdParty
          ref: master
          path: openboard/OpenBoard-ThirdParty

      # ------------------------------------------------------------
      # INSTALL QT 6.8
      # ------------------------------------------------------------
      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          dir: "D:\\Qt"
          modules: >
            qtwebengine
            qtmultimedia
            qtpositioning
            qtwebchannel
            qt5compat
          cache: true

      # ------------------------------------------------------------
      # SETUP MSVC
      # ------------------------------------------------------------
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ------------------------------------------------------------
      # BUILD QUAZIP  (only ThirdParty component that needs compiling)
      # ------------------------------------------------------------
      - name: Build QuaZip
        working-directory: openboard/OpenBoard-ThirdParty/quazip
        run: |
          qmake quazip.pro
          nmake release

      # ------------------------------------------------------------
      # BUILD OpenBoard
      # ------------------------------------------------------------
      - name: Build OpenBoard
        working-directory: openboard/OpenBoard
        run: |
          qmake OpenBoard.pro CONFIG+=release
          nmake release

      # ------------------------------------------------------------
      # DEPLOY Qt runtime
      # The qmake build puts the exe under build\win32\release\product\
      # ------------------------------------------------------------
      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $product = "openboard\OpenBoard\build\win32\release\product"
          $exe     = Get-ChildItem $product -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "No .exe found in $product" }
          Write-Host "Deploying: $($exe.FullName)"
          windeployqt --release --compiler-runtime --no-translations --no-opengl-sw $exe.FullName

      # ------------------------------------------------------------
      # COPY ThirdParty DLLs into the product folder
      # (poppler, openssl, zlib — pre-built binaries from ThirdParty)
      # ------------------------------------------------------------
      - name: Copy ThirdParty DLLs
        shell: pwsh
        run: |
          $product  = "openboard\OpenBoard\build\win32\release\product"
          $tp       = "openboard\OpenBoard-ThirdParty"

          # Poppler
          Copy-Item "$tp\poppler\bin\*.dll"                    $product -Force -ErrorAction SilentlyContinue

          # OpenSSL
          Copy-Item "$tp\openssl\openssl-3.0.15-win64\bin\*.dll" $product -Force -ErrorAction SilentlyContinue

          # zlib
          Copy-Item "$tp\zlib\1.2.11\bin\*.dll"               $product -Force -ErrorAction SilentlyContinue

          Write-Host "DLLs in product folder:"
          Get-ChildItem $product -Filter "*.dll" | Select-Object Name

      # ------------------------------------------------------------
      # CLEANUP build artifacts before upload
      # ------------------------------------------------------------
      - name: Cleanup build artifacts
        shell: pwsh
        run: |
          Get-ChildItem "openboard\OpenBoard\build" `
            -Include *.obj,*.pdb,*.ilk -Recurse -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue

      # ------------------------------------------------------------
      # UPLOAD
      # ------------------------------------------------------------
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenBoard-master-Windows
          compression-level: 9
          path: openboard/OpenBoard/build/win32/release/product/
