name: Build OpenBoard master (Qt 6.8 Prebuilt)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  POWERSHELL_TELEMETRY_OPTOUT: 1

jobs:
  build:
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:

      # ------------------------------------------------------------
      # FREE DISK SPACE
      # ------------------------------------------------------------
      - name: Free Disk Space
        run: |

          Write-Host "Disk space BEFORE cleanup:"
          Get-PSDrive C,D

          Remove-Item "C:\Program Files\Android" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\hostedtoolcache\windows\CodeQL" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:USERPROFILE\.cargo" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:USERPROFILE\.rustup" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\ghcup" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\Program Files\PostgreSQL" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\Program Files\MongoDB" -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "Disk space AFTER cleanup:"
          Get-PSDrive C,D

      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: recursive

      # ------------------------------------------------------------
      # PATCH OPENBOARD
      # ------------------------------------------------------------
      - name: Patch OpenBoard for Windows
        run: |

          # Disable PipeWire
          (Get-Content CMakeLists.txt) `
            -replace 'include\(cmake/DependencyPipewire.cmake\)', '# PipeWire disabled on Windows' `
            | Set-Content CMakeLists.txt

          Write-Host "OpenBoard patched successfully."

      # ------------------------------------------------------------
      # DISABLE LEGACY XPDF RENDERER
      # ------------------------------------------------------------
      - name: Disable XPDFRenderer
        run: |

          Remove-Item `
            "src/pdf/XPDFRenderer.cpp" `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            "src/pdf/XPDFRenderer.h" `
            -Force `
            -ErrorAction SilentlyContinue

          Get-ChildItem -Recurse -Include *.cpp,*.h,CMakeLists.txt | ForEach-Object {

            (Get-Content $_.FullName) `
              | Where-Object {
                  $_ -notmatch 'XPDFRenderer'
                } `
              | Set-Content $_.FullName
          }

          Write-Host "XPDFRenderer disabled."

      # ------------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ------------------------------------------------------------
      # MSVC
      # ------------------------------------------------------------
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # ------------------------------------------------------------
      # BUILD TOOLS
      # ------------------------------------------------------------
      - name: Install Build Tools
        run: |
          choco install ninja pkgconfiglite -y --no-progress

      # ------------------------------------------------------------
      # PREPARE DIRECTORIES
      # ------------------------------------------------------------
      - name: Prepare Directories
        run: |

          New-Item -ItemType Directory -Force D:\build | Out-Null
          New-Item -ItemType Directory -Force D:\vcpkg | Out-Null
          New-Item -ItemType Directory -Force D:\vcpkg-cache | Out-Null
          New-Item -ItemType Directory -Force D:\Qt | Out-Null
          New-Item -ItemType Directory -Force D:\quazip-install | Out-Null

      # ------------------------------------------------------------
      # CACHE
      # ------------------------------------------------------------
      - name: Restore vcpkg Cache
        uses: actions/cache@v4
        with:
          path: D:\vcpkg-cache
          key: openboard-vcpkg-x64-v5
          restore-keys: |
            openboard-vcpkg-x64-

      # ------------------------------------------------------------
      # BOOTSTRAP VCPKG
      # ------------------------------------------------------------
      - name: Bootstrap vcpkg
        env:
          VCPKG_BINARY_SOURCES: clear;files,D:\vcpkg-cache,readwrite
        run: |

          git clone https://github.com/microsoft/vcpkg D:\vcpkg

          cd D:\vcpkg

          .\bootstrap-vcpkg.bat

      # ------------------------------------------------------------
      # INSTALL DEPENDENCIES
      # ------------------------------------------------------------
      - name: Install Dependencies
        env:
          VCPKG_BINARY_SOURCES: clear;files,D:\vcpkg-cache,readwrite
        run: |

          D:\vcpkg\vcpkg.exe install `
            ffmpeg:x64-windows `
            poppler:x64-windows `
            zlib:x64-windows `
            freetype:x64-windows `
            openssl:x64-windows `
            --disable-metrics `
            --clean-after-build

      # ------------------------------------------------------------
      # INSTALL QT (PREBUILT)
      # ------------------------------------------------------------
      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          dir: "D:\\Qt"

          modules: >
            qtwebengine
            qtmultimedia
            qtpositioning
            qtwebchannel
            qt5compat

          cache: true

      # ------------------------------------------------------------
      # SET QT ENVIRONMENT
      # ------------------------------------------------------------
      - name: Set Qt Environment
        run: |

          $qtPath = "D:\Qt\Qt\6.8.3\msvc2022_64"

          if (!(Test-Path $qtPath)) {
            throw "Qt path not found: $qtPath"
          }

          echo "QT_ROOT=$qtPath" >> $env:GITHUB_ENV

          echo "CMAKE_PREFIX_PATH=$qtPath;D:\quazip-install;D:\vcpkg\installed\x64-windows" >> $env:GITHUB_ENV

          echo "PKG_CONFIG_PATH=D:\vcpkg\installed\x64-windows\lib\pkgconfig" >> $env:GITHUB_ENV

      # ------------------------------------------------------------
      # BUILD QUAZIP AGAINST INSTALLED QT
      # ------------------------------------------------------------
      - name: Build QuaZip for Qt6
        run: |

          git clone https://github.com/stachenov/quazip.git D:\quazip

          cmake -B D:\quazip-build -S D:\quazip `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT" `
            -DCMAKE_INSTALL_PREFIX="D:\quazip-install" `
            -DQUAZIP_QT_MAJOR_VERSION=6 `
            -DBUILD_SHARED_LIBS=ON

          cmake --build D:\quazip-build --parallel 2

          cmake --install D:\quazip-build

      # ------------------------------------------------------------
      # VERIFY QT
      # ------------------------------------------------------------
      - name: Verify Qt
        run: |

          Write-Host "QT_ROOT = $env:QT_ROOT"

          if (!(Test-Path "$env:QT_ROOT\lib\cmake\Qt6")) {
            throw "Qt6 cmake files missing"
          }

          Get-ChildItem "$env:QT_ROOT\lib\cmake"

      # ------------------------------------------------------------
      # CONFIGURE
      # ------------------------------------------------------------
      - name: Configure CMake
        run: |

          cmake -B D:\build -S . `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_STANDARD=20 `
            -DCMAKE_MAKE_PROGRAM="C:/ProgramData/chocolatey/bin/ninja.exe" `
            -DCMAKE_TOOLCHAIN_FILE="D:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT;D:\quazip-install;D:/vcpkg/installed/x64-windows" `
            -DQt6_DIR="$env:QT_ROOT/lib/cmake/Qt6" `
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt5=ON `
            -DCMAKE_DISABLE_FIND_PACKAGE_PipeWire=ON `
            -DQT_FEATURE_pipewire=OFF `
            -DBUILD_TESTING=OFF

      # ------------------------------------------------------------
      # BUILD
      # ------------------------------------------------------------
      - name: Build
        run: |
          cmake --build D:\build --config Release --parallel 2

      # ------------------------------------------------------------
      # DEPLOY QT
      # ------------------------------------------------------------
      - name: Deploy Qt Runtime
        run: |

          $exe = Get-ChildItem D:\build -Filter "*.exe" -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "No executable found."
          }

          Write-Host "Deploying $($exe.FullName)"

          & "$env:QT_ROOT\bin\windeployqt.exe" `
            --release `
            --compiler-runtime `
            --no-translations `
            --no-opengl-sw `
            $exe.FullName

      # ------------------------------------------------------------
      # CLEANUP
      # ------------------------------------------------------------
      - name: Cleanup Before Upload
        run: |

          Get-ChildItem D:\build `
            -Include *.obj,*.pdb,*.ilk `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue

      # ------------------------------------------------------------
      # UPLOAD
      # ------------------------------------------------------------
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: OpenBoard-Windows-Build
          compression-level: 9

          path: |
            D:\build\*.exe
            D:\build\*.dll
            D:\build\platforms\
            D:\build\styles\
            D:\build\imageformats\
            D:\build\iconengines\
            D:\build\tls\
            D:\build\resources\
            D:\build\translations\
            D:\build\QtWebEngineProcess.exe
            D:\build\qtwebengine_*.pak
            D:\build\*.dat
