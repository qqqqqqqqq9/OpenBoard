name: Build OpenBoard master (Qt 6.8.3 - qmake)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  POWERSHELL_TELEMETRY_OPTOUT: 1

jobs:
  build:
    runs-on: windows-2022

    defaults:
      run:
        shell: cmd

    steps:

      # ------------------------------------------------------------
      # FREE DISK SPACE
      # ------------------------------------------------------------
      - name: Free Disk Space
        shell: pwsh
        run: |
          Write-Host "Disk space BEFORE cleanup:"
          Get-PSDrive C,D

          Remove-Item "C:\Program Files\Android" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\hostedtoolcache\windows\CodeQL" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:USERPROFILE\.cargo" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:USERPROFILE\.rustup" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\ghcup" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\Program Files\PostgreSQL" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\Program Files\MongoDB" -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "Disk space AFTER cleanup:"
          Get-PSDrive C,D

      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout OpenBoard
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Checkout OpenBoard-ThirdParty
        uses: actions/checkout@v4
        with:
          repository: OpenBoard-org/OpenBoard-ThirdParty
          path: OpenBoard-ThirdParty

      # ------------------------------------------------------------
      # INSTALL PYTHON + AQT
      # ------------------------------------------------------------
      - name: Install aqtinstall
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall

      # ------------------------------------------------------------
      # INSTALL QT 6.8.3
      # ------------------------------------------------------------
      - name: Install Qt 6.8.3
        shell: pwsh
        run: |
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 `
            --outputdir D:\a\OpenBoard\Qt `
            --modules qtwebengine qt5compat qtmultimedia qtpdf

      # ------------------------------------------------------------
      # MSVC ENV
      # ------------------------------------------------------------
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # ------------------------------------------------------------
      # VERIFY TOOLCHAIN
      # ------------------------------------------------------------
      - name: Verify Environment
        shell: cmd
        run: |
          qmake -v
          nmake /?

      # ------------------------------------------------------------
      # BUILD THIRD PARTY
      # ------------------------------------------------------------
      - name: Build FreeType
        shell: cmd
        run: |
          cd OpenBoard-ThirdParty\freetype
          qmake freetype.pro
          nmake

      - name: Build QuaZIP
        shell: cmd
        run: |
          cd OpenBoard-ThirdParty\quazip
          qmake quazip.pro
          nmake

      - name: Build XPDF
        shell: cmd
        run: |
          cd OpenBoard-ThirdParty\xpdf
          qmake xpdf.pro
          nmake

      # ------------------------------------------------------------
      # BUILD OPENBOARD
      # ------------------------------------------------------------
      - name: Build OpenBoard
        shell: cmd
        run: |
          qmake OpenBoard.pro
          nmake

      # ------------------------------------------------------------
      # FIND EXE
      # ------------------------------------------------------------
      - name: Locate OpenBoard.exe
        shell: cmd
        run: |
          dir /s OpenBoard.exe

      # ------------------------------------------------------------
      # DEPLOY QT
      # ------------------------------------------------------------
      - name: Run windeployqt
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter OpenBoard.exe | Select-Object -First 1
          if (-not $exe) { throw "OpenBoard.exe not found" }

          & "$env:QT_ROOT\bin\windeployqt.exe" `
            --release `
            --compiler-runtime `
            --no-translations `
            --no-opengl-sw `
            $exe.FullName

      # ------------------------------------------------------------
      # PACKAGE
      # ------------------------------------------------------------
      - name: Create Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null

          $exe = Get-ChildItem -Recurse -Filter OpenBoard.exe | Select-Object -First 1
          Copy-Item $exe.Directory.FullName\* package -Recurse -Force

      # ------------------------------------------------------------
      # UPLOAD ARTIFACT
      # ------------------------------------------------------------
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: OpenBoard-Windows-Qt6.8.3
          compression-level: 9
          path: package
