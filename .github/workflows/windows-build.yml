name: Build OpenBoard Dev (Qt 6.8)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  POWERSHELL_TELEMETRY_OPTOUT: 1

jobs:
  build:
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:
      # ------------------------------------------------------------
      # FREE SPACE
      # ------------------------------------------------------------
      - name: Free Disk Space
        run: |
          Remove-Item "C:\Program Files\Android" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\Program Files\dotnet" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\hostedtoolcache\windows\CodeQL" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:USERPROFILE\.cargo" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:USERPROFILE\.rustup" -Recurse -Force -ErrorAction SilentlyContinue

      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: recursive

      # ------------------------------------------------------------
      # PATCH OPENBOARD FOR WINDOWS
      # ------------------------------------------------------------
      - name: Patch OpenBoard
        run: |

          # Disable PipeWire
          (Get-Content CMakeLists.txt) `
            -replace 'include\(cmake/DependencyPipewire.cmake\)', '# disabled on windows' `
            | Set-Content CMakeLists.txt

          # Disable XPDF splash renderer
          if (Test-Path "src/pdf/XPDFRenderer.h") {
            Rename-Item "src/pdf/XPDFRenderer.h" "XPDFRenderer.h.disabled"
          }

          if (Test-Path "src/pdf/XPDFRenderer.cpp") {
            Rename-Item "src/pdf/XPDFRenderer.cpp" "XPDFRenderer.cpp.disabled"
          }

          # Remove references from source lists
          Get-ChildItem -Recurse -Include *.cmake,CMakeLists.txt | ForEach-Object {
            (Get-Content $_.FullName) `
              -replace 'XPDFRenderer.cpp', '' `
              -replace 'XPDFRenderer.h', '' `
              | Set-Content $_.FullName
          }

      # ------------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ------------------------------------------------------------
      # MSVC
      # ------------------------------------------------------------
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # ------------------------------------------------------------
      # TOOLS
      # ------------------------------------------------------------
      - name: Install Build Tools
        run: |
          choco install ninja pkgconfiglite strawberryperl -y --no-progress
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH

      # ------------------------------------------------------------
      # DIRECTORIES
      # ------------------------------------------------------------
      - name: Prepare Directories
        run: |
          New-Item -ItemType Directory -Force D:\build | Out-Null
          New-Item -ItemType Directory -Force D:\vcpkg | Out-Null
          New-Item -ItemType Directory -Force D:\vcpkg-cache | Out-Null
          New-Item -ItemType Directory -Force D:\Qt | Out-Null

      # ------------------------------------------------------------
      # CACHE
      # ------------------------------------------------------------
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: D:\vcpkg-cache
          key: vcpkg-x64-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            vcpkg-x64-

      # ------------------------------------------------------------
      # VCPKG
      # ------------------------------------------------------------
      - name: Bootstrap vcpkg
        env:
          VCPKG_BINARY_SOURCES: clear;files,D:\vcpkg-cache,readwrite
        run: |
          git clone https://github.com/microsoft/vcpkg D:\vcpkg
          cd D:\vcpkg
          .\bootstrap-vcpkg.bat

      # ------------------------------------------------------------
      # DEPENDENCIES
      # ------------------------------------------------------------
      - name: Install Dependencies
        env:
          VCPKG_BINARY_SOURCES: clear;files,D:\vcpkg-cache,readwrite
        run: |
          D:\vcpkg\vcpkg.exe install `
            ffmpeg:x64-windows `
            poppler:x64-windows `
            quazip:x64-windows `
            zlib:x64-windows `
            freetype:x64-windows `
            openssl:x64-windows `
            --disable-metrics

      # ------------------------------------------------------------
      # PKG CONFIG
      # ------------------------------------------------------------
      - name: Setup pkg-config
        run: |
          echo "PKG_CONFIG_PATH=D:\vcpkg\installed\x64-windows\lib\pkgconfig;D:\vcpkg\installed\x64-windows\share\pkgconfig" >> $env:GITHUB_ENV

      # ------------------------------------------------------------
      # QT
      # ------------------------------------------------------------
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          dir: "D:\\Qt"

          modules: >
            qtwebengine
            qtmultimedia
            qtpositioning
            qtwebchannel
            qt5compat

          cache: false

      # ------------------------------------------------------------
      # QT ENV
      # ------------------------------------------------------------
      - name: Set Qt Path
        run: |
          echo "QT_ROOT=D:\Qt\Qt\6.8.3\msvc2022_64" >> $env:GITHUB_ENV

      # ------------------------------------------------------------
      # CONFIGURE
      # ------------------------------------------------------------
      - name: Configure
        run: |
          cmake -B D:\build -S . `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_STANDARD=17 `
            -DCMAKE_TOOLCHAIN_FILE=D:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT" `
            -DQt6_DIR="$env:QT_ROOT/lib/cmake/Qt6" `
            -DCMAKE_DISABLE_FIND_PACKAGE_PipeWire=ON `
            -DBUILD_TESTING=OFF

      # ------------------------------------------------------------
      # BUILD
      # ------------------------------------------------------------
      - name: Build
        run: |
          cmake --build D:\build --config Release --parallel 2

      # ------------------------------------------------------------
      # DEPLOY QT
      # ------------------------------------------------------------
      - name: Deploy Qt
        run: |
          $exe = Get-ChildItem D:\build -Filter "*.exe" -Recurse |
            Select-Object -First 1

          & "$env:QT_ROOT\bin\windeployqt.exe" `
            --release `
            --compiler-runtime `
            --no-translations `
            $exe.FullName

      # ------------------------------------------------------------
      # CLEAN
      # ------------------------------------------------------------
      - name: Cleanup
        run: |
          Get-ChildItem D:\build -Include *.obj,*.pdb,*.ilk -Recurse |
            Remove-Item -Force -ErrorAction SilentlyContinue

      # ------------------------------------------------------------
      # ARTIFACT
      # ------------------------------------------------------------
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: OpenBoard-Windows
          compression-level: 9

          path: |
            D:\build\*.exe
            D:\build\*.dll
            D:\build\platforms\
            D:\build\imageformats\
            D:\build\resources\
            D:\build\translations\
