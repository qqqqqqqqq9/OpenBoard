name: Build OpenBoard Dev (Qt 6.8)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: recursive

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          # Note: qtsvg and qttools are usually included in the core desktop install for 6.8.
          # We only explicitly request the large, separate WebEngine component.
          modules: 'qtwebengine'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        # We use -G "Visual Studio 17 2022" to ensure the correct generator is used
        run: |
          cmake -B build -S . `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenBoard-dev-win64
          # MSVC places binaries in a /Release subfolder of the build directory
          path: build/Release/
          if-no-files-found: warn
          
