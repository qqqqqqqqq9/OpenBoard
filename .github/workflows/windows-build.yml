name: Build OpenBoard Dev (Qt 6.8)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: recursive

      - name: Free Disk Space
        # Windows runners are cluttered. This removes unused SDKs to give us ~20GB+ extra.
        run: |
          Get-ChildItem -Path C:\ -Include *.PDB,*.GDB -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force
          rm -rf "C:/Program Files/Android"
          rm -rf "C:/Program Files (x86)/Android"
          rm -rf "C:/Windows/Temp/*"

      - name: Install Build Dependencies
        run: |
          choco install pkgconfiglite -y
          # Use --overlay-ports if needed, but 'poppler' usually pulls 'fontconfig' and 'freetype'
          # We use --clean-after-build to delete temp object files immediately
          vcpkg install poppler:x64-windows quazip:x64-windows --clean-after-build

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebengine qtmultimedia qtpositioning qtwebchannel'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -B build -S . `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}" `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenBoard-dev-win64
          path: build/Release/
          if-no-files-found: warn
