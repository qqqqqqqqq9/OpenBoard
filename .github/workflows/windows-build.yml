name: Build OpenBoard Dev (Qt 6.8)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VCPKG_BINARY_SOURCES: "clear;nuget,GitHub,readwrite"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  POWERSHELL_TELEMETRY_OPTOUT: 1

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja -y

      - name: Free Disk Space
        shell: pwsh
        run: |
          Write-Host "Disk space before cleanup:"
          Get-PSDrive

          Remove-Item "C:\Program Files\dotnet" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\hostedtoolcache\windows\CodeQL" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\Program Files\Android" -Recurse -Force -ErrorAction SilentlyContinue

          Remove-Item "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\Windows\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "Disk space after cleanup:"
          Get-PSDrive

      - name: Restore vcpkg Cache
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install Build Dependencies
        shell: pwsh
        run: |
          choco install pkgconfiglite -y

          vcpkg install `
            poppler[core]:x64-windows `
            quazip:x64-windows `
            --clean-after-build

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebengine qtmultimedia qtpositioning qtwebchannel'
          cache: true

      - name: Verify Qt Installation
        shell: pwsh
        run: |
          Write-Host "Qt6_ROOT = $env:Qt6_ROOT"
          dir $env:Qt6_ROOT

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S . `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_STANDARD=17 `
            -DCMAKE_PREFIX_PATH="$env:Qt6_ROOT" `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DQT_NO_PACKAGE_VERSION_CHECK=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenBoard-Windows-Build
          path: |
            build/**/*.exe
            build/**/*.dll
