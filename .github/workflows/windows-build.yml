name: Build OpenBoard Dev (Qt 6.8)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  POWERSHELL_TELEMETRY_OPTOUT: 1
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  build:
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:
      # ------------------------------------------------------------
      # FREE DISK SPACE
      # ------------------------------------------------------------
      - name: Free Disk Space
        run: |
          Remove-Item "C:\Program Files\Android" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\hostedtoolcache\windows\CodeQL" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:USERPROFILE\.cargo" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:USERPROFILE\.rustup" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\ghcup" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\Program Files\PostgreSQL" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\Program Files\MongoDB" -Recurse -Force -ErrorAction SilentlyContinue

      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: recursive

      # ------------------------------------------------------------
      # PATCH OPENBOARD
      # ------------------------------------------------------------
      - name: Patch OpenBoard for Windows + Qt6
        run: |

          # --------------------------------------------------------
          # Disable PipeWire
          # --------------------------------------------------------
          (Get-Content CMakeLists.txt) `
            -replace 'include\(cmake/DependencyPipewire.cmake\)', '# PipeWire disabled on Windows' `
            | Set-Content CMakeLists.txt

          # --------------------------------------------------------
          # Disable XPDF renderer completely
          # --------------------------------------------------------
          Get-ChildItem -Recurse -Include *.cpp,*.h,*.cmake,CMakeLists.txt | ForEach-Object {

            (Get-Content $_.FullName) `
              -replace 'XPDFRenderer\.h', 'PDFRenderer.h' `
              -replace 'XPDFRenderer\.cpp', '' `
              -replace 'SplashBitmap\.h', '' `
              -replace 'splash/SplashBitmap\.h', '' `
              -replace 'XPDFRenderer', 'PDFRenderer' `
              | Set-Content $_.FullName

          }

          # --------------------------------------------------------
          # Remove xpdf includes from CMake
          # --------------------------------------------------------
          Get-ChildItem -Recurse -Include CMakeLists.txt | ForEach-Object {

            (Get-Content $_.FullName) `
              | Where-Object {
                  $_ -notmatch 'XPDFRenderer' -and
                  $_ -notmatch 'xpdf'
                } `
              | Set-Content $_.FullName
          }

          Write-Host "Patched OpenBoard successfully."

      # ------------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ------------------------------------------------------------
      # MSVC
      # ------------------------------------------------------------
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # ------------------------------------------------------------
      # NINJA + PKGCONFIG
      # ------------------------------------------------------------
      - name: Install Build Tools
        run: |
          choco install ninja pkgconfiglite -y --no-progress

      # ------------------------------------------------------------
      # DIRECTORIES
      # ------------------------------------------------------------
      - name: Prepare Directories
        run: |
          New-Item -ItemType Directory -Force D:\build | Out-Null
          New-Item -ItemType Directory -Force D:\vcpkg | Out-Null
          New-Item -ItemType Directory -Force D:\vcpkg-cache | Out-Null
          New-Item -ItemType Directory -Force D:\Qt | Out-Null

      # ------------------------------------------------------------
      # CACHE
      # ------------------------------------------------------------
      - name: Restore vcpkg Cache
        uses: actions/cache@v4
        with:
          path: D:\vcpkg-cache
          key: vcpkg-openboard-x64-v5
          restore-keys: |
            vcpkg-openboard-x64-

      # ------------------------------------------------------------
      # VCPKG
      # ------------------------------------------------------------
      - name: Bootstrap vcpkg
        env:
          VCPKG_BINARY_SOURCES: clear;files,D:\vcpkg-cache,readwrite
        run: |
          git clone https://github.com/microsoft/vcpkg D:\vcpkg
          cd D:\vcpkg
          .\bootstrap-vcpkg.bat

      # ------------------------------------------------------------
      # INSTALL QT FROM VCPKG
      # ------------------------------------------------------------
      - name: Install Qt + Dependencies
        env:
          VCPKG_BINARY_SOURCES: clear;files,D:\vcpkg-cache,readwrite
        run: |

          D:\vcpkg\vcpkg.exe install `
            qtbase:x64-windows `
            qttools:x64-windows `
            qtdeclarative:x64-windows `
            qtimageformats:x64-windows `
            qtsvg:x64-windows `
            qt5compat:x64-windows `
            qtwebchannel:x64-windows `
            qtwebengine:x64-windows `
            qtpositioning:x64-windows `
            qtmultimedia:x64-windows `
            ffmpeg:x64-windows `
            poppler:x64-windows `
            quazip:x64-windows `
            zlib:x64-windows `
            freetype:x64-windows `
            openssl:x64-windows `
            --clean-after-build `
            --disable-metrics

      # ------------------------------------------------------------
      # ENVIRONMENT
      # ------------------------------------------------------------
      - name: Setup Environment
        run: |

          echo "CMAKE_PREFIX_PATH=D:\vcpkg\installed\x64-windows" >> $env:GITHUB_ENV

          echo "Qt6_DIR=D:\vcpkg\installed\x64-windows\share\Qt6" >> $env:GITHUB_ENV

          echo "PKG_CONFIG_PATH=D:\vcpkg\installed\x64-windows\lib\pkgconfig" >> $env:GITHUB_ENV

      # ------------------------------------------------------------
      # CONFIGURE
      # ------------------------------------------------------------
      - name: Configure CMake
        run: |

          cmake -B D:\build -S . `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_STANDARD=17 `
            -DCMAKE_TOOLCHAIN_FILE=D:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_PREFIX_PATH="D:/vcpkg/installed/x64-windows" `
            -DQt6_DIR="D:/vcpkg/installed/x64-windows/share/Qt6" `
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt5=ON `
            -DCMAKE_DISABLE_FIND_PACKAGE_PipeWire=ON `
            -DBUILD_TESTING=OFF

      # ------------------------------------------------------------
      # BUILD
      # ------------------------------------------------------------
      - name: Build
        run: |
          cmake --build D:\build --config Release --parallel 2

      # ------------------------------------------------------------
      # DEPLOY QT
      # ------------------------------------------------------------
      - name: Deploy Qt Runtime
        run: |

          $exe = Get-ChildItem D:\build -Filter "*.exe" -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "No executable found."
          }

          Write-Host "Deploying $($exe.FullName)"

          & "D:\vcpkg\installed\x64-windows\tools\Qt6\bin\windeployqt.exe" `
            --release `
            --compiler-runtime `
            --no-translations `
            $exe.FullName

      # ------------------------------------------------------------
      # CLEANUP
      # ------------------------------------------------------------
      - name: Cleanup
        run: |
          Get-ChildItem D:\build -Include *.obj,*.pdb,*.ilk -Recurse -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue

      # ------------------------------------------------------------
      # UPLOAD
      # ------------------------------------------------------------
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: OpenBoard-Windows-Build
          compression-level: 9

          path: |
            D:\build\*.exe
            D:\build\*.dll
            D:\build\platforms\
            D:\build\styles\
            D:\build\imageformats\
            D:\build\iconengines\
            D:\build\tls\
            D:\build\resources\
            D:\build\translations\
            D:\build\QtWebEngineProcess.exe
            D:\build\qtwebengine_*.pak
            D:\build\*.dat
