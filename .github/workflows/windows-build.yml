name: Build OpenBoard Dev (Qt 6.8)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  POWERSHELL_TELEMETRY_OPTOUT: 1

  VCPKG_FEATURE_FLAGS: binarycaching
  VCPKG_BINARY_SOURCES: clear;default,readwrite
  VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-cache

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Tools
        shell: pwsh
        run: |
          choco install ninja pkgconfiglite -y

      - name: Free Disk Space
        shell: pwsh
        run: |
          Remove-Item "C:\Program Files\dotnet" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\hostedtoolcache\windows\CodeQL" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\Program Files\Android" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg C:\vcpkg
          cd C:\vcpkg
          git checkout 2025.04.09
          .\bootstrap-vcpkg.bat

      - name: Fix VCPKG_ROOT
        shell: pwsh
        run: |
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('**/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      # ❗ NO vcpkg install here anymore

      - name: Install Qt 6.8 (prebuilt)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          modules: qtwebengine qtmultimedia qtpositioning qtwebchannel
          cache: true

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S . `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_PREFIX_PATH="$env:Qt6_ROOT" `
            -DBUILD_TESTING=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --parallel

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenBoard-Windows
          path: |
            build/**/*.exe
            build/**/*.dll
