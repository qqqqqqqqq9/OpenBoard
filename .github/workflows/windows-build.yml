name: Build OpenBoard Dev (Qt 6.8)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          choco install pkgconfiglite -y
          # On Windows 2025, vcpkg is at C:\vcpkg.
          # The 'cpp' feature is now part of the core poppler port or recognized automatically.
          vcpkg install poppler:x64-windows quazip:x64-windows

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebengine qtmultimedia qtpositioning qtwebchannel'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -B build -S . `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}" `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenBoard-dev-win64
          path: build/Release/
          if-no-files-found: warn
