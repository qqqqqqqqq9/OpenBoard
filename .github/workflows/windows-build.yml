name: Build OpenBoard Dev (Qt 6.8)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        # Updated from v4 to v6
        uses: actions/checkout@v6
        with:
          ref: dev
          submodules: recursive

      - name: Install Qt 6.8
        # v4 is current; check for v5 if warnings persist
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebengine'

      - name: Setup MSVC
        # ilammy/msvc-dev-cmd usually tracks latest; ensure you are on @v1
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -B build -S . `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Upload Artifact
        # Updated from v4 to v7/v8
        uses: actions/upload-artifact@v8
        with:
          name: OpenBoard-dev-win64
          path: build/Release/
          if-no-files-found: warn
