name: Build OpenBoard Dev (Qt 6.8)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: recursive

      - name: Free Disk Space
        # Targets only non-system areas to avoid "Access Denied" errors
        run: |
          Write-Host "Cleaning temporary and heavy SDK folders..."
          $ErrorActionPreference = 'SilentlyContinue'
          Remove-Item -Recurse -Force "C:\Program Files\Android"
          Remove-Item -Recurse -Force "C:\Program Files (x86)\Android"
          Remove-Item -Recurse -Force "$env:TEMP\*"
          # Clean vcpkg cache if it exists from previous runs/pre-installs
          if (Test-Path "C:\vcpkg\downloads") { Remove-Item -Recurse -Force "C:\vcpkg\downloads\*" }
          Write-Host "Cleanup complete."

      - name: Install Build Dependencies
        run: |
          choco install pkgconfiglite -y
          # vcpkg is pre-installed on GitHub runners; we use it to install deps
          vcpkg install poppler:x64-windows quazip:x64-windows --clean-after-build

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebengine qtmultimedia qtpositioning qtwebchannel'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -B build -S . `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenBoard-dev-win64
          path: build/Release/
          if-no-files-found: warn
