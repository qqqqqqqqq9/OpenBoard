name: Build OpenBoard Dev (Qt 6.8)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: recursive

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          # Added qtmultimedia and qtpositioning which are common OpenBoard dependencies
          modules: 'qtwebengine qtsvg qttools qtmultimedia qtpositioning'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        # Setting CMAKE_PREFIX_PATH ensures CMake finds the Qt installation from the action
        run: |
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenBoard-dev-win64
          # Adjusting path to 'build/Release' as MSVC builds typically output to a subfolder
          path: build/Release/
          if-no-files-found: warn
