name: Build OpenBoard Dev (Qt 6.8)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  POWERSHELL_TELEMETRY_OPTOUT: 1

  VCPKG_FEATURE_FLAGS: binarycaching
  VCPKG_BINARY_SOURCES: clear
  VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-cache
  VCPKG_FORCE_SYSTEM_BINARIES: 1

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Tools
        shell: pwsh
        run: |
          choco install ninja pkgconfiglite -y

      - name: Ensure Ninja in PATH
        shell: pwsh
        run: |
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH

      - name: Free Disk Space
        shell: pwsh
        run: |
          Remove-Item "C:\Program Files\dotnet" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\hostedtoolcache\windows\CodeQL" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\Program Files\Android" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg C:\vcpkg
          cd C:\vcpkg
          git checkout 2025.04.09
          .\bootstrap-vcpkg.bat

      - name: Set VCPKG_ROOT
        shell: pwsh
        run: |
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Create vcpkg cache
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\vcpkg-cache"

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      # vcpkg manifest (FIXED: no invalid features)
      - name: Create vcpkg manifest
        shell: pwsh
        run: |
          @'
          {
            "name": "openboard-deps",
            "version": "1.0",
            "dependencies": [
              "poppler",
              "quazip",
              "zlib",
              "freetype"
            ]
          }
          '@ | Out-File -Encoding utf8 vcpkg.json

      - name: Setup pkg-config
        shell: pwsh
        run: |
          echo "PKG_CONFIG_PATH=C:\vcpkg\installed\x64-windows\lib\pkgconfig;C:\vcpkg\installed\x64-windows\share\pkgconfig" >> $env:GITHUB_ENV

      - name: Install Qt 6.8
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          modules: >
            qtwebengine
            qtmultimedia
            qtpositioning
            qtwebchannel
          cache: true

      - name: Set Qt path
        shell: pwsh
        run: |
          echo "QT_ROOT=${{ steps.qt.outputs.qtpath }}" >> $env:GITHUB_ENV
          Write-Host "Qt path: ${{ steps.qt.outputs.qtpath }}"

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S . `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_STANDARD=17 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT" `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_MANIFEST_MODE=ON `
            -DQT_NO_PACKAGE_VERSION_CHECK=ON `
            -DBUILD_TESTING=OFF

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenBoard-Windows-Build
          path: |
            build/**/*.exe
            build/**/*.dll
