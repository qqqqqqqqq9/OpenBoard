name: Build OpenBoard Dev (Qt 6.8)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  POWERSHELL_TELEMETRY_OPTOUT: 1

jobs:
  build:
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:

      # ------------------------------------------------------------
      # FREE DISK SPACE
      # ------------------------------------------------------------
      - name: Free Disk Space
        run: |
          Write-Host "Disk space BEFORE cleanup:"
          Get-PSDrive C,D

          Remove-Item "C:\Program Files\Android" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\Program Files\dotnet" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\hostedtoolcache\windows\CodeQL" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:USERPROFILE\.cargo" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:USERPROFILE\.rustup" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\ghcup" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\Program Files\LLVM" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\Program Files\PostgreSQL" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\Program Files\MongoDB" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\Program Files\Amazon" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\Program Files\Microsoft SDKs" -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "Disk space AFTER cleanup:"
          Get-PSDrive C,D

      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: recursive

      # ------------------------------------------------------------
      # PATCH OPENBOARD FOR WINDOWS
      # ------------------------------------------------------------
      - name: Patch OpenBoard for Windows
        run: |

          # Disable PipeWire dependency
          (Get-Content CMakeLists.txt) `
            -replace 'include\(cmake/DependencyPipewire.cmake\)', '# PipeWire disabled on Windows' `
            | Set-Content CMakeLists.txt

          Write-Host "PipeWire dependency removed."

          # Disable XPDF Splash renderer
          if (Test-Path "src/pdf/XPDFRenderer.h") {
            Rename-Item "src/pdf/XPDFRenderer.h" "XPDFRenderer.h.disabled"
          }

          if (Test-Path "src/pdf/XPDFRenderer.cpp") {
            Rename-Item "src/pdf/XPDFRenderer.cpp" "XPDFRenderer.cpp.disabled"
          }

          # Remove references from cmake files
          Get-ChildItem -Recurse -Include *.cmake,CMakeLists.txt | ForEach-Object {

            (Get-Content $_.FullName) `
              -replace 'XPDFRenderer.cpp', '' `
              -replace 'XPDFRenderer.h', '' `
              | Set-Content $_.FullName
          }

          Write-Host "XPDF Splash renderer disabled."

      # ------------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ------------------------------------------------------------
      # MSVC
      # ------------------------------------------------------------
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # ------------------------------------------------------------
      # BUILD TOOLS
      # ------------------------------------------------------------
      - name: Install Build Tools
        run: |
          choco install ninja pkgconfiglite strawberryperl --no-progress -y

          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH

      # ------------------------------------------------------------
      # PREPARE DIRECTORIES
      # ------------------------------------------------------------
      - name: Prepare Directories
        run: |
          New-Item -ItemType Directory -Force D:\build | Out-Null
          New-Item -ItemType Directory -Force D:\vcpkg | Out-Null
          New-Item -ItemType Directory -Force D:\vcpkg-cache | Out-Null
          New-Item -ItemType Directory -Force D:\Qt | Out-Null

      # ------------------------------------------------------------
      # RESTORE VCPKG CACHE
      # ------------------------------------------------------------
      - name: Restore vcpkg Binary Cache
        uses: actions/cache@v4
        with:
          path: D:\vcpkg-cache
          key: vcpkg-x64-windows-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            vcpkg-x64-windows-

      # ------------------------------------------------------------
      # BOOTSTRAP VCPKG
      # ------------------------------------------------------------
      - name: Bootstrap vcpkg
        env:
          VCPKG_BINARY_SOURCES: clear;files,D:\vcpkg-cache,readwrite
        run: |
          git clone https://github.com/microsoft/vcpkg D:\vcpkg

          cd D:\vcpkg

          .\bootstrap-vcpkg.bat

      # ------------------------------------------------------------
      # INSTALL DEPENDENCIES
      # ------------------------------------------------------------
      - name: Install Dependencies
        env:
          VCPKG_BINARY_SOURCES: clear;files,D:\vcpkg-cache,readwrite
        run: |
          D:\vcpkg\vcpkg.exe install `
            ffmpeg:x64-windows `
            poppler:x64-windows `
            quazip:x64-windows `
            zlib:x64-windows `
            freetype:x64-windows `
            openssl:x64-windows `
            --disable-metrics

      # ------------------------------------------------------------
      # PKG-CONFIG
      # ------------------------------------------------------------
      - name: Setup pkg-config
        run: |
          echo "PKG_CONFIG_PATH=D:\vcpkg\installed\x64-windows\lib\pkgconfig;D:\vcpkg\installed\x64-windows\share\pkgconfig" >> $env:GITHUB_ENV

      # ------------------------------------------------------------
      # INSTALL QT
      # ------------------------------------------------------------
      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          dir: "D:\\Qt"

          modules: >
            qt5compat
            qtwebengine
            qtmultimedia
            qtpositioning
            qtwebchannel

          cache: false

      # ------------------------------------------------------------
      # SET QT PATH
      # ------------------------------------------------------------
      - name: Set Qt Path
        run: |

          $qtPath = "D:\Qt\Qt\6.8.3\msvc2022_64"

          if (!(Test-Path $qtPath)) {
            throw "Qt path not found: $qtPath"
          }

          echo "QT_ROOT=$qtPath" >> $env:GITHUB_ENV

          Write-Host "QT_ROOT = $qtPath"

      # ------------------------------------------------------------
      # VERIFY QT
      # ------------------------------------------------------------
      - name: Verify Qt Installation
        run: |

          Write-Host "QT_ROOT = $env:QT_ROOT"

          if (!(Test-Path "$env:QT_ROOT\lib\cmake\Qt6")) {
            throw "Qt6 cmake directory missing"
          }

          Get-ChildItem "$env:QT_ROOT\lib\cmake"

      # ------------------------------------------------------------
      # CONFIGURE
      # ------------------------------------------------------------
      - name: Configure CMake
        run: |

          cmake -B D:\build -S . `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_STANDARD=17 `
            -DCMAKE_MAKE_PROGRAM="C:/ProgramData/chocolatey/bin/ninja.exe" `
            -DCMAKE_TOOLCHAIN_FILE="D:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_MANIFEST_MODE=OFF `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT" `
            -DQt6_DIR="$env:QT_ROOT/lib/cmake/Qt6" `
            -DCMAKE_DISABLE_FIND_PACKAGE_Qt5=ON `
            -DCMAKE_DISABLE_FIND_PACKAGE_PipeWire=ON `
            -DQT_FEATURE_pipewire=OFF `
            -DQT_NO_PACKAGE_VERSION_CHECK=ON `
            -DBUILD_TESTING=OFF

      # ------------------------------------------------------------
      # BUILD
      # ------------------------------------------------------------
      - name: Build
        run: |
          cmake --build D:\build --config Release --parallel 2

      # ------------------------------------------------------------
      # DEPLOY QT RUNTIME
      # ------------------------------------------------------------
      - name: Deploy Qt Runtime
        run: |

          $exe = Get-ChildItem D:\build -Filter "*.exe" -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "No executable found."
          }

          Write-Host "Deploying $($exe.FullName)"

          & "$env:QT_ROOT\bin\windeployqt.exe" `
            --release `
            --compiler-runtime `
            --no-translations `
            --no-opengl-sw `
            $exe.FullName

      # ------------------------------------------------------------
      # CLEANUP
      # ------------------------------------------------------------
      - name: Cleanup Before Upload
        run: |
          Get-ChildItem D:\build -Include *.obj,*.pdb,*.ilk -Recurse -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue

      # ------------------------------------------------------------
      # UPLOAD ARTIFACTS
      # ------------------------------------------------------------
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: OpenBoard-Windows-Build
          compression-level: 9

          path: |
            D:\build\*.exe
            D:\build\*.dll
            D:\build\platforms\
            D:\build\styles\
            D:\build\imageformats\
            D:\build\iconengines\
            D:\build\tls\
            D:\build\resources\
            D:\build\translations\
            D:\build\QtWebEngineProcess.exe
            D:\build\qtwebengine_*.pak
            D:\build\*.dat
