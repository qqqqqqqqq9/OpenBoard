name: Build OpenBoard Dev (Qt 6.8)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: recursive

      - name: Install Build Dependencies
        # pkg-config is necessary for finding various OpenBoard dependencies in the dev branch
        run: |
          choco install pkgconfiglite -y

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          # We only explicitly request these major modules. 
          # SVG and Tools are part of the core desktop install in 6.8.
          modules: 'qtwebengine qtmultimedia qtpositioning qtwebchannel'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        # Re-applying the fix for the VS 2022 generator
        run: |
          cmake -B build -S . `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenBoard-dev-win64
          path: build/Release/
          if-no-files-found: warn
