name: Build OpenBoard Dev (Qt 6.8)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  POWERSHELL_TELEMETRY_OPTOUT: 1

  # vcpkg
  VCPKG_FEATURE_FLAGS: binarycaching
  VCPKG_BINARY_SOURCES: clear;default,readwrite
  VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-cache
  VCPKG_FORCE_SYSTEM_BINARIES: 1

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Tools
        shell: pwsh
        run: |
          choco install ninja pkgconfiglite -y

      - name: Free Disk Space
        shell: pwsh
        run: |
          Write-Host "Disk space before cleanup:"
          Get-PSDrive

          Remove-Item "C:\Program Files\dotnet" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\hostedtoolcache\windows\CodeQL" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\Program Files\Android" -Recurse -Force -ErrorAction SilentlyContinue

          Remove-Item "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\Windows\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "Disk space after cleanup:"
          Get-PSDrive

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg C:\vcpkg

          cd C:\vcpkg

          git checkout 2025.04.09

          .\bootstrap-vcpkg.bat

      - name: Fix VCPKG_ROOT
        shell: pwsh
        run: |
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Restore vcpkg Binary Cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('**/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      # OpenBoard uses pkg-config for Poppler detection
      # so we must explicitly install dependencies first
      - name: Install Dependencies
        shell: pwsh
        run: |
          C:\vcpkg\vcpkg.exe install `
            poppler:x64-windows `
            quazip:x64-windows `
            zlib:x64-windows `
            freetype:x64-windows `
            --clean-after-build `
            --disable-metrics

      # Expose pkg-config metadata to CMake
      - name: Setup pkg-config paths
        shell: pwsh
        run: |
          echo "PKG_CONFIG_PATH=C:\vcpkg\installed\x64-windows\lib\pkgconfig;C:\vcpkg\installed\x64-windows\share\pkgconfig" >> $env:GITHUB_ENV

      - name: Install Qt 6.8 (Prebuilt)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"

          modules: >
            qtwebengine
            qtmultimedia
            qtpositioning
            qtwebchannel

          cache: true

      - name: Verify Qt Installation
        shell: pwsh
        run: |
          Write-Host "Qt6_ROOT = $env:Qt6_ROOT"

          if (!(Test-Path $env:Qt6_ROOT)) {
            throw "Qt installation not found"
          }

          dir $env:Qt6_ROOT

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S . `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_STANDARD=17 `
            -DCMAKE_PREFIX_PATH="$env:Qt6_ROOT" `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DQT_NO_PACKAGE_VERSION_CHECK=ON `
            -DBUILD_TESTING=OFF

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: List Build Outputs
        shell: pwsh
        run: |
          Get-ChildItem -Path build -Recurse `
            -Include *.exe,*.dll `
            | Select-Object FullName

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenBoard-Windows-Build
          path: |
            build/**/*.exe
            build/**/*.dll
