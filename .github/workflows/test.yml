name: Debug Qt (Guaranteed Working)

on:
  workflow_dispatch:

jobs:
  qt-test:
    runs-on: windows-2022

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip + aqtinstall
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall

      - name: Confirm aqt exists
        run: |
          python -c "import aqt; print('aqt installed OK')"

      - name: List Qt versions (no filter)
        run: python -m aqt list-qt windows desktop
